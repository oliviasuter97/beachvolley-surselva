<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- "Was möchtest du spielen?" split-hero deactivated for now — forwards straight to home.html.
     Remove this meta refresh (and the matching noscript link below) to bring it back. -->
<meta http-equiv="refresh" content="0; url=home.html">
<title>Volley Surselva – Volleyball & Beachvolleyball in der Surselva</title>
<meta name="description" content="Volley Surselva und der Beachsportclub Surselva bringen Volleyball in die Surselva: Hallentrainings für Kids bis Erwachsene, ein eigener Beachvolleyplatz in Ilanz und Camps im Sommer. Schau vorbei oder werde Teil eines Teams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<noscript><a href="home.html">Weiter zu Volley Surselva →</a></noscript>

<div id="loader" class="loader">
  <div class="loader-track">
    <div class="loader-ball"><img class="ball-icon" src="images/ball-photo.jpg" alt="Volleyball"></div>
  </div>
  <div class="loader-label i18n" data-de="Aufwärmen …" data-en="Warming up …">Aufwärmen …</div>
</div>

<div class="lang-toggle" role="group" aria-label="Sprache / Language">
  <button class="lang-btn active" data-lang="de" type="button">DE</button>
  <button class="lang-btn" data-lang="en" type="button">EN</button>
</div>

<header class="site-header site-header--overlay" id="siteHeader">
  <div class="wrap navbar">
    <a href="#top" class="logo"><img src="images/logo/volley-surselva-logo.png" alt="Volley Surselva" class="logo-img"></a>
  </div>
</header>

<main id="top">

  <section id="hero" class="hero-demo">
    <div class="court" id="courtArea">
      <div class="hero-overlay">
        <h1 class="i18n" data-de="Was möchtest du spielen?" data-en="What do you want to play?">Was möchtest du spielen?</h1>
      </div>
      <div class="court-half court-indoor" data-target="indoor" style="background-image:url('images/indoor/hall-placeholder.jpg');">
        <span class="badge placeholder-badge i18n" data-de="Platzhalterfoto" data-en="Placeholder photo">Platzhalterfoto</span>
        <div class="content">
          <div class="kicker">VBC Foppa</div>
          <h2>Indoor</h2>
          <a href="home.html#teams" class="arrow i18n" data-de="Indoor entdecken →" data-en="Explore Indoor →">Indoor entdecken →</a>
        </div>
      </div>
      <div class="court-seam" aria-hidden="true"></div>
      <div class="court-half court-beach" data-target="beach">
        <video class="beach-video" id="beachVideo" muted loop playsinline preload="none" poster="images/video-posters/beachvolleilanz.jpg">
          <source src="brandvideo/beachvolleyilanz.mov" type="video/quicktime">
          <source src="brandvideo/beachvolleilanz-web.mp4" type="video/mp4">
        </video>
        <div class="content">
          <div class="kicker">@beachsurselva</div>
          <h2>Beach</h2>
          <a href="home.html#beach-anlage" class="arrow i18n" data-de="Beach entdecken →" data-en="Explore Beach →">Beach entdecken →</a>
        </div>
      </div>
      <div class="ball-wrap" id="hero-ball" tabindex="0" role="img" aria-label="Volleyball">
        <div class="ball-inner">
          <img class="ball-icon" src="images/ball-photo.jpg" alt="">
        </div>
        <span class="hero-doodle i18n" data-de="folg mir!" data-en="follow me!">folg mir!</span>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer" style="padding:1.4rem 0;">
  <div class="wrap">
    <p class="fine copyright" style="border:none; padding:0; margin:0;">&copy; 2026 Volley Surselva & Beachsportclub Surselva <a href="impressum.html" class="copyright-link i18n" data-de="Impressum" data-en="Imprint">Impressum</a></p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
